# Terminal and interaction
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -g mouse on
set -g set-clipboard on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits open in the current pane's directory
unbind %
unbind '"'
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Reload this file
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf"

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Compact status bar using the workstation's Sway and Waybar palette
set -g status-interval 5
set -g status-style "bg=#1e1e1e,fg=#d4d4d4"

set -g status-left-length 40
set -g status-left "#[fg=#526b7f,bold] #S #[fg=#808080,nobold]|"

setw -g window-status-separator ""
setw -g window-status-format " #[fg=#808080]#I:#W "
setw -g window-status-current-format \
    " #[fg=#f0f0f0,bg=#344b5e,bold] #I:#W "

set -g status-right-length 120
set -g status-right \
    "#[fg=#b8b8b8]#{pane_current_path} #[fg=#808080]| #[fg=#d4d4d4]%d/%m/%Y %H:%M "
