# Screenshot bindings
#
# This user-layer file replaces Fedora's same-named screenshot snippet.
# Saved captures go to ~/Pictures/Screenshots; Super shortcuts copy instead.

set $screenshot_dir $HOME/Pictures/Screenshots
set $grimshot_save mkdir -p "$screenshot_dir" && XDG_SCREENSHOTS_DIR="$screenshot_dir" grimshot save

bindsym {
    # Preserve Fedora's save bindings.
    Print       exec $grimshot_save output
    Alt+Print   exec $grimshot_save active
    Ctrl+Print  exec $grimshot_save area

    # Clipboard-friendly bindings which do not require the laptop's Print key.
    $mod+Shift+s exec grimshot copy area
    $mod+Shift+w exec grimshot copy active
    $mod+Shift+o exec grimshot copy output
}
